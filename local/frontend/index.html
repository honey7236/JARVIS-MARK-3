<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>J.A.R.V.I.S. MARK III // Holographic HUD</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
	</head>
	<body>
		<!-- 3D WebGL Canvas Container -->
		<div id="webgl-container"></div>

		<!-- Holographic HUD Overlay -->
		<div id="hud-overlay">
			<!-- Bottom Floating Stack: Clean Floating Capsule / Pill Bar -->
			<div class="hud-bottom-stack">
				<!-- Centered greeting / assistant response subtitle -->
				<div class="hud-subtitle" id="dialogue-text">How can I help, Sir?</div>

				<!-- Floating Pill-Shaped Chat Capsule -->
				<div class="hud-pill-capsule" id="dialogue-card">
					<!-- Input Form -->
					<form id="hud-input-form" class="capsule-input-form" onsubmit="return false;">
						<input
							type="text"
							id="hud-input"
							class="capsule-input"
							placeholder="Ask anything..."
							autocomplete="off"
						/>
					</form>

					<!-- Online / Ready status indicator dot -->
					<div class="capsule-status-dot online" id="status-dot" title="JARVIS Online"></div>

					<!-- Themed Microphone / Action Control Button -->
					<button id="btn-mic" class="capsule-mic-btn mic-on" title="Click to mute/unmute voice recognition">
						<svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
							<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
							<line x1="12" y1="19" x2="12" y2="23"></line>
							<line x1="8" y1="23" x2="16" y2="23"></line>
						</svg>
					</button>
				</div>
			</div>
		</div>

		<!-- Eel Bridge (serves dynamic /eel.js when launched by Python) -->
		<script type="text/javascript" src="/eel.js"></script>

		<!-- Local Three.js Engine & Hologram Script -->
		<script src="three.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
